name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# One deployment at a time; don't cancel a running one.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - id: pages
        uses: actions/configure-pages@v5
      - run: npm ci
      # Pages that need a server (`*.server.tsx` / `*.server.ts` under src/pages) can't be
      # static files, so leave them out of this build. Same for the proxy (src/proxy.server.ts):
      # static files have no server to run it. This only changes the CI checkout.
      - name: Remove server-only pages
        run: |
          find src/pages -name "*.server.tsx" -o -name "*.server.ts" | xargs rm -f
          rm -f src/proxy.server.ts
      # The site calls Supabase from the visitor's browser (GitHub Pages has no server), so the
      # Supabase URL and public key are written into the JS files at build time. Without them
      # the site builds but no product request can be made, so stop here with a clear message.
      # Add them in Settings -> Secrets and variables -> Actions (Variables or Secrets tab).
      - name: Check Supabase settings
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ vars.NEXT_PUBLIC_SUPABASE_URL || secrets.NEXT_PUBLIC_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ vars.NEXT_PUBLIC_SUPABASE_ANON_KEY || secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
        run: |
          if [ -z "$NEXT_PUBLIC_SUPABASE_URL" ] || [ -z "$NEXT_PUBLIC_SUPABASE_ANON_KEY" ]; then
            echo "::error title=Supabase is not set up::Add NEXT_PUBLIC_SUPABASE_URL and NEXT_PUBLIC_SUPABASE_ANON_KEY in Settings > Secrets and variables > Actions (see docs/supabase-setup.md, step 5), then re-run this workflow."
            exit 1
          fi
      - run: npm run build
        env:
          # Build plain static files for GitHub Pages (see next.config.ts)
          STATIC_EXPORT: "true"
          # e.g. "/mello", so links and assets work at https://<user>.github.io/mello/
          PAGES_BASE_PATH: ${{ steps.pages.outputs.base_path }}
          # Absolute site address for the Open Graph share image. Set the
          # NEXT_PUBLIC_SITE_URL variable to use a custom domain instead of github.io.
          NEXT_PUBLIC_SITE_URL: ${{ vars.NEXT_PUBLIC_SITE_URL || steps.pages.outputs.base_url }}
          # Either tab works: Variables (vars) or Secrets.
          NEXT_PUBLIC_SUPABASE_URL: ${{ vars.NEXT_PUBLIC_SUPABASE_URL || secrets.NEXT_PUBLIC_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ vars.NEXT_PUBLIC_SUPABASE_ANON_KEY || secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
      - uses: actions/upload-pages-artifact@v3
        with:
          path: out

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
